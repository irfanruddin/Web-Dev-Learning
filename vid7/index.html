<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application</title>
</head>
<body>
    <h1>Form to apply for Jr. Devloper </h1>
    <form action="post">
        <div>
        <label for="username"> Enter Your Name: </label>
        <input type="text" id="username" name="username" placeholder="Enter your name">
        </div>
        <div>
            <label for=""> select your gender </label>
            <div>
    
            </div>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male"> Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
        </div>
        <div>
            <label for="">Your Field of intrest: </label>
            <div>
            <input type="checkbox" id="tech" name="intrest" value="tech" >
            <label for="tech">Technology</label>
            <input type="checkbox" id="mgmt" name="intrest" value="mgmt">
            <label for="mgmt">Management</label>
            <input type="checkbox" id="fin" name="intrest" value="fin">
            <label for="fin">Finance</label>
        </div>
        <label for="comment"> Enter your comment </label>
        <br>
        <textarea id="comment" name="comment" placeholder="comment here "></textarea>
        <div>
        <select name="fruits">
            <option value="apple">apple</option>
            <option value="banana">banana</option>
            <option value="orange">orange</option>
        </select>
        </div>
    </form>
</body>
</html>
