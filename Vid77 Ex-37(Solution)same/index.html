<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body {
        margin: 10px;
      }

      .card {
        /* border: 2px solid black; */

        width: 1000px;
        display: flex;
        flex-direction: row;
        padding: 10px;
        
      }
      .card:hover {
        box-shadow: 0px 0px 10px 1px rgb(100, 98, 98);
        background-color: rgb(220, 217, 217);
      }
      img {
        margin: 10px;
        border-radius: 5px;
        min-height: 130px;
      }

      .image {
        position: relative;
      }
      .text h1,
      p {
        margin-top: 15px;
      }
      .capsule {
        background-color: rgb(100, 98, 98);
        padding: 3px;
        border-radius: 4px;
        color: white;
        font-weight: bolder;
        position: absolute;
        bottom: 15px;
        right: 15px;
    
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="image">
          <img src="image.jpg" alt="" />
          <div class="capsule">34:10</div>
        </div>

        <div class="text">
          <h1>Java Scricpt Excercise-13 | Solution & Shoutouts # 73</h1>
          <p>CodeWithHarry • 272k views • 2 months ago</p>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
