<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        *{
            margin: 010;
            padding: 010;
        }
        .Box{
            border: 2px solid blue;
            display: inline-block;
            width:auto;
        }
        p{
            border: 2px solid black;
            display: inline-flex;
        }
        .ter{
            border: 2px solid maroon;
            display: flexbox;
        }
        span{
            border: 2px solid green;
            display: block;
        }
        .war{
            /* display: none; */
            visibility: hidden;
        }
    </style>
  </head>
  <body>
    <div class="Box">hey i am a box.</div>
    <p class="war">i am also a box</p>
    <p class="ter"> do not forget me.</p>
    <span>Using a span element</span>
  </body>
</html>
