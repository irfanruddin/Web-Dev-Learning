<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
      }
      .box {
        border: 2px solid black;
        width: 100px;
        min-height: 100px;
        display: grid;
        place-items: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="a" class="box">Box 1</div>
      <div id="s" class="box">Box 2</div>
      <div id="d" class="box">Box 3</div>
      <div id="f" class="box">Box 4</div>
      <div id="g" class="box">Box 5</div>
    </div>
    <script>
      document.querySelectorAll(".box").forEach((e) => {
        e.style.backgroundColor = "green";
      });

      let boxes = document.getElementsByClassName("box");
      boxes[2].style.backgroundColor = "blue";

      document.getElementById("s").style.backgroundColor = "yellow";

      document.querySelector(".box").style.backgroundColor = "brown";
    </script>
  </body>
</html>
