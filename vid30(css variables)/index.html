<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <style>
      :root {
        --defmar: 10px;
        --defpad: 10px;
        --color: rgb(116, 116, 227);
        --seccolor: rgb(193, 193, 234);
        --defopa: 0.8;
      }
      ul {
        display: flex;
        list-style: none;
        background-color: var(--color);
        padding: var(--defpad);
        margin: var(--defmar);
        gap: 10px;
        margin-bottom: 0%;
        opacity: var(--defopa);
      }
      p {
        margin: var(--defmar);
        padding: var(--defpad);
        background-color: var(--seccolor);
        margin-top: 0%;
        opacity: var(--defopa);
      }
    </style>
  </head>
  <body>
    <div>
      <ul>
        <i class="fa-solid fa-user"></i>
        <li>About</li>
        <i class="fa-solid fa-home"></i>
        <li>Home</li>
        <i class="fa-solid fa-envelope"></i>
        <li>Contact</li>
      </ul>
      <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Exercitationem,
        ut laudantium fugit quis accusamus impedit, non ipsum suscipit in
        facilis molestiae esse est amet laboriosam.
      </p>
    </div>
  </body>
</html>
