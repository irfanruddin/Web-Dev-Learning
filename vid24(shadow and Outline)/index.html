<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 5px;
        padding: 5px;
      }
      .box {
        border: 2px solid black;
        box-shadow: 2px 4px 15px 1px #9f8383;
      }
      .car {
        margin-top: 20px;
        font-size: xx-large;
        text-shadow: 5px 3px 3px grey;
        border: 2px solid green;
        border-radius: 2px;
        outline: 2px solid maroon;
        outline-offset: 5px;
      }
      body {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      Lorem ipsum dolor sit amet consectetur, adipisicing elit.
    </div>
    <div class="car">A B C D E F G H I</div>
  </body>
</html>
