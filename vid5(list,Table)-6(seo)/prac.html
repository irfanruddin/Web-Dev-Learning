<!DOCTYPE html>
<html lang="en">
<head>
    <title>List</title>
    <style>
        ul li {
            list-style: "😎";
        }
    </style>
</head>
<body>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
    </ul>
    <ol>
        <li>HTML</li>
        <li>JS</li>
        <li>JS</li>
    </ol>
    <dl>
        <dt>HTML 1</dt>
        <dd>Hyper Text Markup Language 1</dd>
        <dt>CSS 2</dt>
        <dd>Cascading Style Sheet 2</dd>
        <dt>JS 3</dt>
        <dd>Java Script 3</dd>
    </dl>
</body>
</html>
